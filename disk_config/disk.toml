# ArcOS Disk Layout - btrfs with shared user space
# All subvolumes share the same btrfs pool (no per-user quotas)

[[customizations.filesystem]]
mountpoint = "/"
minsize = "15 GiB"
filesystem_type = "btrfs"

[[customizations.filesystem.btrfs.subvolumes]]
name = "root"
mountpoint = "/"

[[customizations.filesystem.btrfs.subvolumes]]
name = "@home"
mountpoint = "/home"

# User subvolumes created by systemd-homed with pattern @users-USERNAME
# systemd-homed manages these dynamically at user creation time

[[customizations.filesystem.btrfs.subvolumes]]
name = "@snapshots"
mountpoint = "/.snapshots"

[[customizations.filesystem.btrfs.subvolumes]]
name = "@swap"
mountpoint = "/swap"

# EFI System Partition
[[customizations.filesystem]]
mountpoint = "/boot/efi"
minsize = "512 MiB"
filesystem_type = "vfat"
